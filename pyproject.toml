[build-system]
requires = ["setuptools>=77.0.3", "wheel", "setuptools-rust>=1.12,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "metafile-render"
version = "0.4.1"
description = "Render WMF and EMF files to SVG, PNG, JPEG, and WebP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Xiaomeng Zhao (myhloli)"}]
requires-python = ">=3.11,<3.15"
keywords = ["wmf", "emf", "metafile", "svg", "png", "jpeg", "webp", "rendering"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=11.0.0; python_version < '3.14'",
    "pillow>=12.0.0; python_version >= '3.14'",
    "pyclipper>=1.3.0.post6,<2; python_version < '3.14'",
    "pyclipper>=1.4.0,<2; python_version >= '3.14'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pypptx-with-oxml>=1.0.3,<2"]
dev = ["metafile-render[test]", "ruff", "build", "twine", "mypy"]

[project.urls]
Repository = "https://github.com/myhloli/metafile-render"
Issues = "https://github.com/myhloli/metafile-render/issues"

[project.scripts]
metafile-render = "metafile_render.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
metafile_render = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 128
target-version = "py311"

[tool.ruff.lint]
select = ["C", "E", "F", "W", "ANN"]
ignore = ["C901", "ANN204", "ANN401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyclipper", "pyclipper.*"]
ignore_missing_imports = true

[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux*"
test-command = "python {project}/tools/verify_installation.py --output wheel-smoke"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
