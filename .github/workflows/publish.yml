name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          native_version = tomllib.loads(pathlib.Path('rust/Cargo.toml').read_text())['package']['version']
          if native_version != version:
              raise SystemExit('Rust and Python package versions differ')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match package version')
          PY
      - run: python -m pip install build twine
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - run: python tools/verify_release_artifacts.py dist "${{ github.event.release.tag_name }}"
      - run: python -m twine check dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metafile-render/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
