name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m pip check

  minimum:
    name: Minimum dependencies / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            pillow: '11.0.0'
            os: ubuntu-latest
            pyclipper: '1.3.0'
          - python: '3.14'
            pillow: '12.0.0'
            os: ubuntu-latest
            pyclipper: '1.4.0'
          - python: '3.10'
            pillow: '11.0.0'
            pyclipper: '1.3.0'
            os: windows-latest
          - python: '3.14'
            pillow: '12.0.0'
            pyclipper: '1.4.0'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pillow==${{ matrix.pillow }}" "pyclipper==${{ matrix.pyclipper }}"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff build twine mypy
      - run: python -m pip install .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/metafile_render
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distributions.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: ci-distributions
          path: dist/*
