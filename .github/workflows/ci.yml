name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m pip check
      - name: Render cross-platform review samples
        if: matrix.python == '3.13'
        run: python tools/render_review.py review-artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: review-${{ matrix.os }}
          path: review-artifacts/

  raqm:
    name: Pillow 13.0 / RAQM regression / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libfribidi0 fonts-noto-cjk
      - run: python -m pip install ".[test]" "pillow==13.0.0"
      - name: Require real RAQM and CJK fonts
        run: |
          python - <<'PY'
          from PIL import ImageFont, features
          from metafile_render.fonts.resolve import resolve_font
          assert features.check("raqm"), "RAQM must be enabled in this regression job"
          assert features.version("raqm") == "0.11.0"
          font = ImageFont.truetype("/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc", 12)
          assert font.layout_engine == ImageFont.Layout.RAQM
          assert "Noto" in resolve_font("Noto Sans CJK SC", 12, 400, False, 134).family
          print({name: features.version(name) for name in ("raqm", "fribidi", "harfbuzz")})
          PY
      - run: python -m pytest -q tests/test_text_layout.py
      - run: python -m pip check

  minimum:
    name: Minimum dependencies / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            pillow: '11.0.0'
            os: ubuntu-latest
            pyclipper: '1.3.0.post6'
          - python: '3.13'
            pillow: '11.0.0'
            os: ubuntu-latest
            pyclipper: '1.3.0.post6'
          - python: '3.14'
            pillow: '12.0.0'
            os: ubuntu-latest
            pyclipper: '1.4.0'
          - python: '3.11'
            pillow: '11.0.0'
            pyclipper: '1.3.0.post6'
            os: windows-latest
          - python: '3.13'
            pillow: '11.0.0'
            pyclipper: '1.3.0.post6'
            os: windows-latest
          - python: '3.14'
            pillow: '12.0.0'
            pyclipper: '1.4.0'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pillow==${{ matrix.pillow }}" "pyclipper==${{ matrix.pyclipper }}"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ruff build twine mypy
      - run: python -m pip install .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/metafile_render
      - run: python tools/build_distributions.py dist
      - run: python -m twine check dist/*
      - run: python tools/check_distributions.py dist --output package-installation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-installation
          path: |
            package-installation/summary.json
            package-installation/*/process.log
            package-installation/*/verification/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-distributions
          path: dist/*

  native:
    uses: ./.github/workflows/native-wheels.yml
