name: Native wheels

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x86_64, name: linux-x86_64, python_arch: x64, deployment: ''}
          - {os: ubuntu-24.04-arm, arch: aarch64, name: linux-aarch64, python_arch: arm64, deployment: ''}
          - {os: windows-latest, arch: AMD64, name: windows-x86_64, python_arch: x64, deployment: ''}
          - {os: windows-11-arm, arch: ARM64, name: windows-arm64, python_arch: arm64, deployment: ''}
          - {os: macos-15, arch: arm64, name: macos-arm64, python_arch: arm64, deployment: '14.0'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-11-arm'
        with:
          arch: amd64_arm64
      - run: python -m pip install "cibuildwheel>=3.1,<4"
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-24.04, name: linux-x86_64, python_arch: x64}
          - {os: ubuntu-24.04-arm, name: linux-aarch64, python_arch: arm64}
          - {os: windows-latest, name: windows-x86_64, python_arch: x64}
          - {os: windows-11-arm, name: windows-arm64, python_arch: arm64}
          - {os: macos-15, name: macos-arm64, python_arch: arm64}
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.python_arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform.os == 'windows-11-arm'
        with:
          arch: amd64_arm64
      - uses: actions/download-artifact@v7
        with:
          name: native-${{ matrix.platform.name }}
          path: wheelhouse
      - run: python -m pip install packaging
      - run: python tools/check_distributions.py wheelhouse --output installation-checks
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: install-${{ matrix.platform.name }}-py${{ matrix.python }}
          path: |
            installation-checks/summary.json
            installation-checks/*/process.log
            installation-checks/*/verification/report.json
